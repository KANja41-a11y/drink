<style>
*{margin:0;box-sizing:border-box}
:root{--deep:#3F482E}
html,body{height:100%;background:#2b3022;overflow:hidden;font-family:Jost,'Helvetica Neue',sans-serif}
@media (prefers-color-scheme:dark){:root{--deep:#3F482E}}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#F8F6EF;cursor:pointer}

.shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);background-size:260% 100%;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:.5}
.sh{position:absolute;left:6%;right:6%;bottom:-26px;height:46px;border-radius:50%;background:radial-gradient(ellipse,rgba(70,80,45,.4),transparent 70%);filter:blur(10px)}
.tx{position:absolute;text-align:center;color:var(--deep)}
.ln{white-space:pre;line-height:1.04;font-family:'Gowun Batang','Hiragino Mincho ProN','Yu Mincho',Georgia,serif}
.ln span{display:inline-block;white-space:pre;will-change:transform,opacity}
#vg{background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(60,68,40,.2) 100%)}
#gr{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#pb{position:absolute;left:0;bottom:0;height:6px;width:0;background:#858D62;opacity:.7}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(248,246,239,.55);backdrop-filter:blur(14px);transition:opacity .5s;text-align:center;color:var(--deep)}
#ov.h{opacity:0;pointer-events:none}
#ov b{display:block;font:700 190px 'Gowun Batang',Georgia,serif;color:#6B7449}
#ov p{font-size:40px;font-weight:300;letter-spacing:.1em;margin:10px 0 70px}
#ov button{font:400 38px Jost,sans-serif;letter-spacing:.14em;padding:30px 70px;border-radius:99px;border:2px solid #858D62;background:#858D62;color:#F8F6EF;cursor:pointer}

function cupSt(i,t){let cur=SEG[i][0];for(const[a,b,to,e]of SEG[i][1]){if(t<a)return cur;const g=typeof to=='function',d=g?to(Math.min(t,b)):to;if(t<b)return mix(cur,d,(e||eio)(g?sg(t,a,a+.9):sg(t,a,b)));cur=d}return cur}

function music(c,T){const B=.625,o=c.createGain();o.gain.value=.9;o.connect(c.destination);

let ctx=null,play=false,base=0,c0=0;
const clk=()=>ctx?ctx.currentTime:performance.now()/1000,now=()=>Math.max(0,play?base+clk()-c0:base),ov=$('#ov'),btn=$('#btn');
async function go(){if(base>=20||!ctx&&base==0||!ctx){if(ctx)try{ctx.close()}catch(e){}ctx=null;try{ctx=new(window.AudioContext||window.webkitAudioContext)();const T=ctx.currentTime+.15;music(ctx,T);c0=T}catch(e){ctx=null;c0=clk()+.15}base=0}else{if(ctx)await ctx.resume();c0=clk()}play=true;ov.classList.add('h')}
